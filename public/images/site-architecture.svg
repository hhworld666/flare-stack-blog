<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">HH's Blog 新站技术架构</title>
  <desc id="desc">作者通过 TipTap 后台编辑文章，由 Cloudflare Worker 处理网站和数据接口；D1 保存内容与互动数据，R2 保存图片，KV 和 Queues 支持缓存与通知。GitHub 与 Workers Builds 更新网站程序。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff" />
      <stop offset="1" stop-color="#f3f6fb" />
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7658e8" />
      <stop offset="1" stop-color="#5740c4" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d3566" flood-opacity=".12" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#9385d8" />
    </marker>
  </defs>

  <rect width="1440" height="880" rx="30" fill="url(#canvas)" />
  <circle cx="1310" cy="120" r="170" fill="#e9e4ff" opacity=".55" />
  <circle cx="120" cy="760" r="210" fill="#e7eef8" opacity=".62" />

  <g font-family="Inter, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="76" y="72" fill="#8b7acb" font-size="14" font-weight="700" letter-spacing="3">HH'S BLOG / SYSTEM MAP</text>
    <text x="76" y="123" fill="#25233a" font-size="34" font-weight="700">新站的文章、页面和数据怎样协作</text>
    <text x="76" y="158" fill="#747287" font-size="17">Flare Stack Blog 运行在 Cloudflare Workers，文章由网页后台直接管理。</text>

    <text x="76" y="212" fill="#8b7acb" font-size="13" font-weight="700" letter-spacing="2">01 / WRITE &amp; READ · 写作与访问</text>

    <g filter="url(#shadow)">
      <rect x="76" y="238" width="350" height="224" rx="22" fill="#fff" stroke="#e5e3f2" />
      <rect x="104" y="270" width="54" height="54" rx="16" fill="#eeeaff" />
      <path d="M118 285h26m-26 9h26m-26 9h17" stroke="#7055d8" stroke-width="3" stroke-linecap="round" />
      <text x="178" y="285" fill="#8a7ac5" font-size="12" font-weight="700" letter-spacing="1.8">AUTHOR</text>
      <text x="178" y="316" fill="#28263b" font-size="23" font-weight="700">网页文章后台</text>
      <text x="104" y="365" fill="#626176" font-size="16">TipTap 富文本编辑器</text>
      <text x="104" y="394" fill="#626176" font-size="16">草稿自动保存 · 设置分类与标签</text>
      <rect x="104" y="418" width="158" height="25" rx="12" fill="#f0edff" />
      <text x="183" y="435" fill="#6852c2" font-size="12" text-anchor="middle" font-weight="700">发布后即时更新文章</text>

      <rect x="538" y="218" width="370" height="270" rx="24" fill="url(#worker)" />
      <circle cx="578" cy="264" r="15" fill="#ffb96c" />
      <path d="M571 264h14m-7-7v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
      <text x="610" y="260" fill="#dcd5ff" font-size="12" font-weight="700" letter-spacing="1.8">APPLICATION</text>
      <text x="574" y="315" fill="#fff" font-size="27" font-weight="700">Cloudflare Worker</text>
      <text x="574" y="352" fill="#eeeaff" font-size="16">React 19 · TanStack Start</text>
      <text x="574" y="381" fill="#eeeaff" font-size="16">公开页面 · 管理后台 · 数据接口</text>
      <rect x="574" y="414" width="294" height="43" rx="13" fill="#ffffff" opacity=".13" />
      <text x="721" y="441" fill="#fff" font-size="14" text-anchor="middle">服务端渲染文章与页面</text>

      <rect x="1020" y="218" width="344" height="392" rx="24" fill="#fff" stroke="#e5e3f2" />
      <text x="1052" y="260" fill="#8a7ac5" font-size="12" font-weight="700" letter-spacing="1.8">CLOUDFLARE DATA</text>
      <text x="1052" y="293" fill="#28263b" font-size="22" font-weight="700">内容与媒体服务</text>

      <rect x="1052" y="319" width="280" height="58" rx="14" fill="#f3f0ff" />
      <circle cx="1080" cy="348" r="9" fill="#7658e8" />
      <text x="1102" y="345" fill="#343149" font-size="16" font-weight="700">D1 数据库</text>
      <text x="1102" y="365" fill="#77758b" font-size="12">文章 · 用户 · 评论 · 搜索索引</text>

      <rect x="1052" y="390" width="280" height="58" rx="14" fill="#fff3e9" />
      <circle cx="1080" cy="419" r="9" fill="#f48120" />
      <text x="1102" y="416" fill="#343149" font-size="16" font-weight="700">R2 存储</text>
      <text x="1102" y="436" fill="#77758b" font-size="12">封面、正文图片与媒体文件</text>

      <rect x="1052" y="461" width="280" height="58" rx="14" fill="#edf5ff" />
      <circle cx="1080" cy="490" r="9" fill="#4f8edc" />
      <text x="1102" y="487" fill="#343149" font-size="16" font-weight="700">KV 缓存</text>
      <text x="1102" y="507" fill="#77758b" font-size="12">加快公开内容读取</text>

      <rect x="1052" y="532" width="280" height="54" rx="14" fill="#edf7f2" />
      <circle cx="1080" cy="559" r="9" fill="#43a17a" />
      <text x="1102" y="556" fill="#343149" font-size="16" font-weight="700">Queues · Durable Objects</text>
      <text x="1102" y="576" fill="#77758b" font-size="12">异步通知 · 请求限流</text>
    </g>

    <path d="M438 350h86" fill="none" stroke="#9385d8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="480" y="331" fill="#8175bc" font-size="12" text-anchor="middle">保存与发布</text>
    <path d="M920 350h86" fill="none" stroke="#9385d8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="963" y="331" fill="#8175bc" font-size="12" text-anchor="middle">读取数据</text>

    <text x="76" y="548" fill="#8b7acb" font-size="13" font-weight="700" letter-spacing="2">02 / CODE RELEASE · 网站程序更新</text>
    <g filter="url(#shadow)">
      <rect x="76" y="576" width="340" height="190" rx="22" fill="#fff" stroke="#e5e3f2" />
      <text x="108" y="620" fill="#8a7ac5" font-size="12" font-weight="700" letter-spacing="1.8">SOURCE CODE</text>
      <text x="108" y="659" fill="#28263b" font-size="23" font-weight="700">GitHub 仓库</text>
      <text x="108" y="698" fill="#626176" font-size="15">保存 Flare 程序与站点配置</text>
      <text x="108" y="727" fill="#626176" font-size="15">文章日常发布不需要推送代码</text>

      <rect x="538" y="576" width="370" height="190" rx="22" fill="#fff" stroke="#e5e3f2" />
      <text x="574" y="620" fill="#8a7ac5" font-size="12" font-weight="700" letter-spacing="1.8">AUTOMATION</text>
      <text x="574" y="659" fill="#28263b" font-size="23" font-weight="700">Workers Builds</text>
      <text x="574" y="698" fill="#626176" font-size="15">代码推送后自动构建、部署</text>
      <text x="574" y="727" fill="#626176" font-size="15">用于更新网站程序</text>

      <rect x="1020" y="644" width="344" height="122" rx="22" fill="#fff3e9" stroke="#f4dcc8" />
      <text x="1052" y="688" fill="#c76720" font-size="12" font-weight="700" letter-spacing="1.8">VISITORS</text>
      <text x="1052" y="724" fill="#28263b" font-size="21" font-weight="700">读者浏览文章、登录和评论</text>
      <text x="1052" y="749" fill="#77758b" font-size="14">评论提交后会直接显示</text>
    </g>

    <path d="M430 672h92" fill="none" stroke="#9385d8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="477" y="653" fill="#8175bc" font-size="12" text-anchor="middle">提交代码</text>
    <path d="M920 672h86" fill="none" stroke="#9385d8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="963" y="653" fill="#8175bc" font-size="12" text-anchor="middle">更新 Worker</text>

    <text x="76" y="823" fill="#858397" font-size="13">旧 Supabase 账号、访客资料、评论与浏览量不会迁入新站。</text>
    <text x="1364" y="823" fill="#a39dbb" font-size="12" text-anchor="end">HH'S BLOG · 2026</text>
  </g>
</svg>
